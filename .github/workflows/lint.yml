name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      # hoi_retarget/gmr/ is excluded in ruff.toml: the vendored files are
      # sha256-pinned against upstream, so formatting them breaks the pin.
      - run: ruff check .
      - run: ruff format --check .
